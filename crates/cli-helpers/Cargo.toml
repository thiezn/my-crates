[package]
name = "cli-helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/thiezn/my-crates"
description = "Reusable helpers for Rust CLI applications"

[features]
default = []
clap = ["dep:clap", "output", "tracing"]
config = ["dep:serde", "dep:toml"]
interactive = ["dep:dialoguer"]
markdown = ["dep:pulldown-cmark"]
output = ["dep:serde", "dep:serde_json"]
paths = ["dep:dirs"]
progress = ["dep:indicatif"]
tracing = ["dep:serde", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
clap = { workspace = true, optional = true }
dialoguer = { version = "0", optional = true }
dirs = { version = "6", optional = true }
indicatif = { version = "0", optional = true }
pulldown-cmark = { version = "0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
], optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
